name: ci-build

on:
  workflow_dispatch:
  push:
    branches: [inc_ksu]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout kernel source (inc_ksu)
        uses: actions/checkout@v4
        with:
          ref: inc_ksu
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libssl-dev libelf-dev \
            device-tree-compiler cpio rsync gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Fetch clang r383902
        run: |
          mkdir -p "$PWD/clang"
          curl -sSL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.1.0_r27/clang-r383902.tar.gz" | tar -xz -C "$PWD/clang"
          "$PWD/clang/bin/clang" --version

      - name: Swap KernelSU with SukiSU kernel
        run: |
          git clone --depth 1 https://github.com/SukiSU-Ultra/SukiSU-Ultra /tmp/sukisu
          rm -rf drivers/kernelsu
          cp -r /tmp/sukisu/kernel drivers/kernelsu
          cp -r /tmp/sukisu/uapi drivers/kernelsu/uapi 2>/dev/null || true
          ls drivers/kernelsu
          grep -E '^config KSU$' drivers/kernelsu/Kconfig || true
          # 4.14 compat patches
          python3 - <<'PY'
          p='drivers/kernelsu/hook/syscall_hook.h'
          s=open(p).read()
          if 'typedef void (*syscall_fn_t)' not in s:
              s='#include <linux/version.h>\n#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 0, 0)\ntypedef void (*syscall_fn_t)(void);\n#endif\n'+s
              open(p,'w').write(s)
          p='drivers/kernelsu/kernel_compat.h'
          s=open(p).read()
          if 'copy_from_user_nofault' not in s:
              s+='\n#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 8, 0)\n#define copy_from_user_nofault(dst, src, size) probe_kernel_read(dst, (void __user *)(src), size)\n#endif\n'
              open(p,'w').write(s)
          print('compat patched')
          PY
          sed -i '/MODULE_IMPORT_NS/d' drivers/kernelsu/core/init.c

      - name: Set kernel identity to stock
        run: |
          sed -i 's/^SUBLEVEL = 357/SUBLEVEL = 186/' Makefile
          sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION =/' Makefile
          if grep -q '^CONFIG_LOCALVERSION=' arch/arm64/configs/chopin_defconfig; then
            sed -i 's|^CONFIG_LOCALVERSION=.*|CONFIG_LOCALVERSION="-gaa24d707761c"|' arch/arm64/configs/chopin_defconfig
          else
            echo 'CONFIG_LOCALVERSION="-gaa24d707761c"' >> arch/arm64/configs/chopin_defconfig
          fi
          sed -i 's/^CONFIG_WIREGUARD=y/# CONFIG_WIREGUARD is not set/' arch/arm64/configs/chopin_defconfig
          sed -i 's/^# CONFIG_KSU_SUSFS is not set/CONFIG_KSU_SUSFS=y/' arch/arm64/configs/chopin_defconfig
          for opt in CONFIG_KSU_SUSFS_SUS_PATH CONFIG_KSU_SUSFS_SUS_MOUNT CONFIG_KSU_SUSFS_SUS_KSTAT CONFIG_KSU_SUSFS_TRY_UMOUNT CONFIG_KSU_SUSFS_SUS_MAP CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS CONFIG_KSU_SUSFS_ENABLE_LOG; do
            echo "$opt=y" >> arch/arm64/configs/chopin_defconfig
          done
          grep -E '^VERSION|^PATCHLEVEL|^SUBLEVEL|^EXTRAVERSION' Makefile
          grep LOCALVERSION arch/arm64/configs/chopin_defconfig

      - name: Build kernel
        env:
          KBUILD_BUILD_USER: builder
          KBUILD_BUILD_HOST: pangu-build-component-vendor-176809-mjwkw-h4m64-542cj
          KBUILD_BUILD_TIMESTAMP: "Thu Nov  2 16:13:34 UTC 2023"
        run: |
          export ARCH=arm64
          export LC_ALL=C
          export PATH="$PWD/clang/bin:$PATH"
          mkdir -p out
          make O=out ARCH=arm64 chopin_defconfig
          make -j"$(nproc)" O=out \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=gcc \
            HOSTLD=ld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            STRIP=llvm-strip \
            AS=llvm-as \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            CONFIG_NO_ERROR_ON_MISMATCH=y

      - name: Show artifacts
        run: ls -l out/arch/arm64/boot/

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: Image-inc_ksu
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: warn

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: chopin-kernel-${{ github.run_number }}
          body: |
            Kernel: 4.14.186-gaa24d707761c (stock identity, inc_ksu + selinux_hide)
            Commit: ${{ github.sha }}
            Run: ${{ github.run_number }}
          files: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
          fail_on_unmatched_files: false
