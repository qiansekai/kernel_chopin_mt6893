name: build-kernel

on:
  workflow_dispatch:
  push:
    branches: [ksun]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout kernel source (ksun)
        uses: actions/checkout@v4
        with:
          ref: ksun
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev device-tree-compiler cpio rsync

      - name: Fetch clang r383902
        run: |
          mkdir -p "$PWD/clang"
          curl -sSL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r383902.tar.gz" | tar -xz -C "$PWD/clang"
          "$PWD/clang/bin/clang" --version

      - name: Build kernel
        run: |
          export ARCH=arm64
          export LC_ALL=C
          mkdir -p out
          make O=out ARCH=arm64 chopin_user_defconfig
          PATH="$PWD/clang/bin:$PATH" make -j"$(nproc)" O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$PWD/clang/bin/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$PWD/clang/bin/arm-linux-gnueabi-" \
            LD=ld.lld \
            STRIP=llvm-strip \
            AS=llvm-as \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            CONFIG_NO_ERROR_ON_MISMATCH=y

      - name: Show artifacts
        run: ls -l out/arch/arm64/boot/

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: Image-ksun
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: warn
